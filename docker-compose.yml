services:
  expo:
    image: node:20-slim
    container_name: rpg-soundboard-expo
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8081:8081"
    stdin_open: true
    tty: true
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - EXPO_TOKEN=${EXPO_TOKEN}
    command: sh -c "npx expo start --tunnel"

